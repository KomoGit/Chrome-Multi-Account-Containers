<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --line: #8884; }
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; }
  h1 { font-size: 13px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; }
  .row:hover { background: #8882; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .n { opacity: .6; min-width: 1em; text-align: right; }
  .row button { border: 0; background: none; cursor: pointer; padding: 2px 3px; opacity: .55; color: inherit; font: inherit; font-size: 12px; }
  .row button:hover, .row button.armed { opacity: 1; }
  section, form { padding: 8px 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  form { grid-template-columns: 1fr auto auto; }
  form > * { min-width: 0; }
  .hint { opacity: .6; font-size: 12px; }
</style>
<h1>Containers <span class="hint">— click to open a new tab</span></h1>
<div id="list"></div>
<section>
  <label>This tab <select id="move"></select></label>
  <label><span>Always open <b id="host"></b> in</span> <select id="assign"></select></label>
</section>
<form id="form">
  <input name="name" placeholder="New container" required maxlength="40">
  <select name="color"></select>
  <button id="save">Add</button>
</form>
<script src="common.js"></script>
<script src="popup.js"></script>
